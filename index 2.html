<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141C">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141C;--panel:#1A1D29;--raise:#232736;--line:#2C3142;--text:#ECEBF4;--dim:#8C90A6;--accent:#6FD3C0;--on:#12141C;--p:#8B9BFF;--c:#F2B66D;--f:#F48FB1;--over:#FF7A7A;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 "DM Sans",system-ui,sans-serif;padding-bottom:96px}
main{max-width:480px;margin:0 auto;padding:16px}
h1,h2,.num{font-family:Sora,system-ui,sans-serif}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:15px;font-weight:600;margin:24px 0 10px;color:var(--dim)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dnav{display:flex;align-items:center;gap:4px}
.dnav button{width:36px;height:36px;border-radius:12px;background:var(--panel);font-size:20px}
.dnav span{min-width:72px;text-align:center;font-weight:600}
.hero{background:var(--panel);border-radius:28px;padding:22px 18px;display:flex;align-items:center;gap:18px}
.ring{position:relative;width:156px;height:156px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:34px;font-weight:700;line-height:1}
.bars{flex:1;display:grid;gap:14px}
.bar .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar .row b{font-weight:600}.bar .row span{color:var(--dim)}
.track{height:8px;border-radius:8px;background:var(--raise);overflow:hidden}
.fill{height:100%;border-radius:8px;transition:width .35s}
details{margin-top:14px;background:var(--panel);border-radius:20px;padding:14px 16px}
.sheet details{background:var(--raise)}
summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--dim)}details[open] summary::after{content:"–"}
details .bars{margin-top:14px}
.mh{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px}
.mh b{font-family:Sora,sans-serif;font-size:16px}
.add{background:var(--raise);border-radius:12px;padding:8px 14px;font-weight:600;color:var(--accent)}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:18px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.sheet .item{background:var(--raise)}
.item .nm{flex:1;min-width:0}
.item .nm div:first-child{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--dim)}
.item .k{font-family:Sora,sans-serif;font-weight:600}
.x{width:34px;height:34px;border-radius:10px;background:var(--raise);color:var(--dim);flex:none}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);flex:none;font-weight:700;color:var(--on)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.empty{color:var(--dim);background:var(--panel);border-radius:18px;padding:18px;text-align:center}
.cta{display:block;width:100%;background:var(--accent);color:var(--on);font-weight:600;border-radius:16px;padding:14px;margin-top:14px}
.cta.alt{background:var(--raise);color:var(--text)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:480px;gap:4px}
nav button{flex:1;padding:12px 0;border-radius:14px;color:var(--dim);font-weight:500;font-size:13px}
nav button.on{background:var(--raise);color:var(--text)}
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--panel);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 14px;color:var(--text);font-size:18px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px 10px;min-width:0}
.panel{background:var(--panel);border-radius:20px;padding:14px 16px;margin-top:12px}
.panel input{background:var(--bg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.g3b{display:grid;grid-template-columns:1fr 90px;gap:8px}
.ing{display:grid;grid-template-columns:1fr 78px 64px 34px;gap:6px;margin-bottom:8px;align-items:center}
.goal{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.goal input{width:86px;text-align:right;padding:10px}
.goal .two{display:flex;gap:6px;align-items:center}
.link{color:var(--f);font-size:14px;margin-top:12px}
.wbig{font-size:40px;font-weight:700;line-height:1.1}
.ico{width:38px;height:38px;border-radius:12px;background:var(--raise);font-size:22px;flex:none;display:flex;align-items:center;justify-content:center}
.sheet .ico{background:var(--panel)}
.dnav .menu{width:40px;height:40px;margin-left:6px;display:flex;align-items:center;justify-content:center}
.seg{padding:12px;border-radius:14px;background:var(--raise);font-weight:600}
.seg.on{background:var(--accent);color:var(--on)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
input[type=color]{cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
</head>

<script>
const KEY='macro-app-v1';
const DM=[['fibre','Fibre','g',30],['vc','Vitamin C','mg',45],['vd','Vitamin D','µg',15],['fe','Iron','mg',14],['ca','Calcium','mg',1000]];
let S={foods:[],combos:[],log:[],goals:{kcal:2800,p:130,c:390,f:80},micros:null,
 meals:[{id:'m1',kcal:930,p:43},{id:'m2',kcal:930,p:43},{id:'m3',kcal:930,p:43}],
 weights:[],supps:[],sl:{},shop:[],set:{theme:'dark',accent:'#6FD3C0'}};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)S=Object.assign(S,r)}catch(e){}
if(!S.micros)S.micros=DM.map(([k,n,u,g])=>({k,n,u,g:(S.goals&&S.goals[k])||g}));
if(S.meals.some(m=>m.id==='s')&&!S.log.some(e=>!e.meal||e.meal==='s'))S.meals=S.meals.filter(m=>m.id!=='s');
S.foods.forEach(f=>{
  if(!f.m){f.m={};S.micros.forEach(x=>f.m[x.k]=+f[x.k]||0)}
  if(!f.base){const mt=(f.serving||'').match(/([\d.]+)\s*(g|ml)/i);f.base=mt?+mt[1]:100;f.u=mt?mt[2].toLowerCase():'g'}
});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const iso=d=>d.toLocaleDateString('en-CA');
let day=iso(new Date()),tab='today',cb=null,pend={},qr=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r0=n=>Math.round(n||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const food=id=>S.foods.find(f=>f.id===id);
const mult=(f,v,u)=>(u==='mg'?v/1000:v)/f.base;
const todays=()=>S.log.filter(e=>e.date===day&&food(e.foodId));
const mealOf=e=>S.meals.some(m=>m.id===e.meal)?e.meal:S.meals[0].id;
const mname=id=>'Meal '+(S.meals.findIndex(m=>m.id===id)+1);
function comboTot(c){const t={kcal:0,p:0,c:0,f:0};c.items.forEach(it=>{const f=food(it.foodId);if(!f)return;const n=mult(f,it.v,it.u);for(const k in t)t[k]+=(+f[k]||0)*n});return t}

function totals(){
  const t={kcal:0,p:0,c:0,f:0,m:{}};
  todays().forEach(e=>{const f=food(e.foodId);['kcal','p','c','f'].forEach(k=>t[k]+=(+f[k]||0)*e.n);S.micros.forEach(x=>t.m[x.k]=(t.m[x.k]||0)+((f.m&&+f.m[x.k])||0)*e.n)});
  return t;
}
function bar(label,val,goal,unit,col){
  const pct=goal?Math.min(100,val/goal*100):0;
  return `<div class="bar"><div class="row"><b>${esc(label)}</b><span>${r0(val)} / ${goal} ${esc(unit)}</span></div><div class="track"><div class="fill" style="width:${pct}%;background:${val>goal*1.1?'var(--over)':col}"></div></div></div>`;
}
function dayLabel(){
  const t=iso(new Date()),y=iso(new Date(Date.now()-864e5));
  if(day===t)return 'Today';if(day===y)return 'Yesterday';
  return new Date(day+'T12:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'});
}
function shift(n){const d=new Date(day+'T12:00');d.setDate(d.getDate()+n);day=iso(d);render()}
function hdr(title,nav){return `<div class="top"><h1>${title}</h1><div class="dnav">${nav?`<button aria-label="Previous day" onclick="shift(-1)">‹</button><span>${dayLabel()}</span><button aria-label="Next day" onclick="shift(1)">›</button>`:''}<button class="menu" aria-label="Settings" onclick="settingsSheet()"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div></div>`}

function render(){
  $('tabs').innerHTML=[['today','Today'],['foods','Foods'],['weight','Weight'],['supps','Supps'],['shop','Shop'],['goals','Goals']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
  $('app').innerHTML={today:vToday,foods:vFoods,weight:vWeight,supps:vSupps,shop:vShop,goals:vGoals}[tab]();
}

function entry(e){const f=food(e.foodId);
  return `<div class="item"><div class="nm"><div>${esc(f.name)}</div><div class="sub">${+(e.n*f.base).toFixed(1)} ${f.u} · P ${r0(f.p*e.n)} C ${r0(f.c*e.n)} F ${r0(f.f*e.n)}</div></div><div class="k">${r0(f.kcal*e.n)}</div><button class="x" aria-label="Remove" onclick="delLog('${e.id}')">✕</button></div>`}

function vToday(){
  const t=totals(),g=S.goals,C=2*Math.PI*66,left=g.kcal-t.kcal,pct=Math.min(1,t.kcal/g.kcal),es=todays();
  const meals=S.meals.map((m,i)=>{
    const L=es.filter(e=>mealOf(e)===m.id);
    const k=L.reduce((a,e)=>a+food(e.foodId).kcal*e.n,0),p=L.reduce((a,e)=>a+food(e.foodId).p*e.n,0);
    return `<div class="mh"><div><b>Meal ${i+1}</b><div class="sub">${r0(k)}${m.kcal?' / '+m.kcal:''} kcal · P ${r0(p)}${m.p?' / '+m.p:''} g</div></div><span style="display:flex;gap:6px;align-items:center"><button class="add" onclick="logSheet('${m.id}')">+ Add food</button>${i>2?`<button class="x" aria-label="Remove Meal ${i+1}" onclick="delMeal(${i})">✕</button>`:''}</span></div>`+L.map(entry).join('');
  }).join('');
  return hdr('Macros',1)+`<div class="hero"><div class="ring"><svg width="156" height="156" viewBox="0 0 156 156"><circle cx="78" cy="78" r="66" fill="none" stroke="var(--raise)" stroke-width="12"/><circle cx="78" cy="78" r="66" fill="none" stroke="${left<0?'var(--over)':'var(--accent)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${pct*C} ${C}"/></svg>
  <div class="mid"><div class="num big">${Math.abs(r0(left))}</div><div class="sub">${left<0?'kcal over':'kcal left'}</div></div></div>
  <div class="bars">${bar('Protein',t.p,g.p,'g','var(--p)')}${bar('Carbs',t.c,g.c,'g','var(--c)')}${bar('Fat',t.f,g.f,'g','var(--f)')}</div></div>
  <details><summary>Vitamins &amp; minerals</summary><div class="bars">${S.micros.length?S.micros.map(x=>bar(x.n,t.m[x.k]||0,x.g,x.u,'var(--accent)')).join(''):'<div class="sub">Add vitamins to track in Goals.</div>'}</div></details>`+meals+
  `<button class="cta alt" onclick="addMeal()">+ Meal ${S.meals.length+1}</button>`;
}
function addMeal(){S.meals.push({id:'m'+uid(),kcal:0,p:0});save();render()}
function delMeal(i){
  const m=S.meals[i];if(!m||S.meals.length<2)return;
  const n=S.log.filter(e=>mealOf(e)===m.id).length;
  if(n&&!confirm('Remove Meal '+(i+1)+'? Foods logged in it, on any day, will be deleted.'))return;
  S.log=S.log.filter(e=>mealOf(e)!==m.id);S.meals.splice(i,1);save();render();
}

function vFoods(){
  return hdr('Foods')+(S.foods.length?S.foods.map(f=>`<button class="item" onclick="foodSheet('${f.id}')"><span class="ico">${icon(f.name)}</span><div class="nm"><div>${esc(f.name)}</div><div class="sub">per ${f.base} ${f.u} · P ${f.p||0} C ${f.c||0} F ${f.f||0}</div></div><div class="k">${r0(f.kcal)}</div></button>`).join(''):'<div class="empty">No foods yet. Add one with its macros for an amount like 100 g, then log it in grams.</div>')+
  `<button class="cta" onclick="foodSheet()">New food</button><button class="cta alt" onclick="scanSheet()">Scan barcode</button><h2 style="margin-top:32px">Saved meals</h2>`+
  (S.combos.length?S.combos.map(c=>{const t=comboTot(c);return `<button class="item" onclick="comboSheet('${c.id}')"><div class="nm"><div>${esc(c.name)}</div><div class="sub">${c.items.length} ingredients · P ${r0(t.p)} C ${r0(t.c)} F ${r0(t.f)}</div></div><div class="k">${r0(t.kcal)}</div></button>`}).join(''):'<div class="empty">Combine several foods into one meal, with the grams of each. Log it in one tap.</div>')+
  `<button class="cta alt" onclick="comboSheet()">New saved meal</button>`;
}

function vWeight(){
  const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1),last=w[w.length-1],cur=w.find(x=>x.d===day);
  let ch='';
  if(w.length>1){
    const v=w.slice(-30).map(x=>x.kg),mn=Math.min(...v),mx=Math.max(...v),n=v.length;
    const pts=v.map((y,i)=>`${(i/(n-1)*296+2).toFixed(1)},${(54-(y-mn)/((mx-mn)||1)*48).toFixed(1)}`).join(' ');
    const d=last.kg-w[0].kg;
    ch=`<div class="sub" style="margin-top:6px">${d>0?'+':''}${d.toFixed(1)} kg since ${new Date(w[0].d+'T12:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}</div><svg viewBox="0 0 300 60" width="100%" height="70" style="margin-top:12px"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  return hdr('Weight',1)+`<div class="panel">${last?`<div class="num wbig">${last.kg} kg</div>${ch}`:'<div class="sub">No weigh-ins yet.</div>'}</div>
  <div class="panel"><label style="margin-top:0">Weight for ${dayLabel().toLowerCase()} (kg)</label><input id="wk" type="number" inputmode="decimal" step="0.1" value="${cur?cur.kg:''}"><button class="cta" onclick="addW()">Save weight</button></div>
  <h2>History</h2>`+(w.length?[...w].reverse().map(x=>`<div class="item"><div class="nm"><div>${x.kg} kg</div><div class="sub">${new Date(x.d+'T12:00').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'})}</div></div><button class="x" aria-label="Delete" onclick="delW('${x.d}')">✕</button></div>`).join(''):'<div class="empty">Log your first weigh-in above.</div>');
}
function addW(){const kg=+$('wk').value;if(!(kg>0)){$('wk').focus();return}
  S.weights=S.weights.filter(x=>x.d!==day);S.weights.push({d:day,kg:Math.round(kg*10)/10});save();render()}
function delW(d){S.weights=S.weights.filter(x=>x.d!==d);save();render()}

function vSupps(){
  const done=S.sl[day]||[];
  return hdr('Supplements',1)+(S.supps.length?S.supps.map(s=>`<div class="item"><button class="chk ${done.includes(s.id)?'on':''}" aria-label="Taken" onclick="tg('${s.id}')">${done.includes(s.id)?'✓':''}</button><div class="nm"><div>${esc(s.n)}</div><div class="sub">${esc(s.d||'')}</div></div><button class="x" aria-label="Remove" onclick="delSupp('${s.id}')">✕</button></div>`).join(''):'<div class="empty">No supplements yet. Add what you take below, then tick it off each day.</div>')+
  `<div class="panel"><label style="margin-top:0">Supplement name</label><input id="sn" placeholder="Magnesium glycinate"><label>Dose (optional)</label><input id="sd" placeholder="400 mg, evening"><button class="cta" onclick="addSupp()">Add supplement</button></div>`;
}
function tg(id){const a=S.sl[day]||[];S.sl[day]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();render()}
function addSupp(){const n=$('sn').value.trim();if(!n){$('sn').focus();return}S.supps.push({id:uid(),n,d:$('sd').value.trim()});save();render()}
function delSupp(id){S.supps=S.supps.filter(s=>s.id!==id);save();render()}

function vGoals(){
  return hdr('Goals')+`<h2>Daily macros</h2>`+[['kcal','Calories','kcal'],['p','Protein','g'],['c','Carbs','g'],['f','Fat','g']].map(([k,l,u])=>`<div class="goal"><span>${l} <span class="sub">(${u})</span></span><input type="number" inputmode="decimal" value="${S.goals[k]}" onchange="S.goals['${k}']=+this.value||0;save()"></div>`).join('')+
  `<h2>Per meal: kcal and protein (g)</h2>`+S.meals.map((m,i)=>`<div class="goal"><span>Meal ${i+1}</span><span class="two"><input type="number" inputmode="decimal" aria-label="Meal ${i+1} kcal" value="${m.kcal}" onchange="S.meals[${i}].kcal=+this.value||0;save()"><input type="number" inputmode="decimal" aria-label="Meal ${i+1} protein" value="${m.p}" onchange="S.meals[${i}].p=+this.value||0;save()">${i>2?`<button class="x" aria-label="Remove meal ${i+1}" onclick="delMeal(${i})">✕</button>`:''}</span></div>`).join('')+
  `<h2>Vitamins &amp; minerals</h2>`+S.micros.map((x,i)=>`<div class="goal"><span>${esc(x.n)} <span class="sub">(${esc(x.u)})</span></span><span class="two"><input type="number" inputmode="decimal" aria-label="${esc(x.n)} goal" value="${x.g}" onchange="S.micros[${i}].g=+this.value||0;save()"><button class="x" aria-label="Remove ${esc(x.n)}" onclick="delMicro(${i})">✕</button></span></div>`).join('')+
  `<div class="panel"><label style="margin-top:0">Add a vitamin or mineral</label><div class="g3"><input id="mn" placeholder="Zinc"><input id="mu" placeholder="mg"><input id="mg" type="number" inputmode="decimal" placeholder="Goal"></div><button class="cta" onclick="addMicro()">Add to tracker</button></div>`;
}
function addMicro(){const n=$('mn').value.trim();if(!n){$('mn').focus();return}
  S.micros.push({k:'m'+uid(),n,u:$('mu').value.trim()||'mg',g:+$('mg').value||0});save();render()}
function delMicro(i){S.micros.splice(i,1);save();render()}

function modal(html){$('modal').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeM()"><div class="sheet">${html}</div></div>`}
function closeM(){stopQr();$('modal').innerHTML='';render()}

function foodSheet(id,draft,mid){
  const f=id?food(id):(draft||{});pend={bc:draft&&draft.bc,mid};
  modal(`<h2>${id?'Edit food':'New food'}</h2>${draft&&draft.note?`<div class="sub">${draft.note}</div>`:''}
  <label>Name</label><input id="fn" value="${esc(f.name||'')}" placeholder="Chicken breast, raw">
  <label>The amounts below are for</label><div class="g3b"><input id="fb" type="number" inputmode="decimal" value="${f.base||100}"><select id="fu"><option>g</option><option${f.u==='ml'?' selected':''}>ml</option></select></div>
  <div class="g2"><div><label>Calories (kcal)</label><input id="fkcal" type="number" inputmode="decimal" value="${f.kcal??''}" placeholder="auto"></div><div><label>Protein (g)</label><input id="fp" type="number" inputmode="decimal" value="${f.p??''}"></div>
  <div><label>Carbs (g)</label><input id="fc" type="number" inputmode="decimal" value="${f.c??''}"></div><div><label>Fat (g)</label><input id="ff" type="number" inputmode="decimal" value="${f.f??''}"></div></div>
  ${S.micros.length?`<details><summary>Vitamins &amp; minerals (optional)</summary><div class="g2">${S.micros.map(x=>`<div><label>${esc(x.n)} (${esc(x.u)})</label><input id="m_${x.k}" type="number" inputmode="decimal" value="${(f.m&&f.m[x.k])??''}"></div>`).join('')}</div></details>`:''}
  <button class="cta" onclick="saveFood('${id||''}')">Save food</button>
  ${id?`<button class="link" onclick="delFood('${id}')">Delete this food</button>`:''}`);
}
function saveFood(id){
  const n=$('fn').value.trim();if(!n){$('fn').focus();return}
  const g=k=>+$('f'+k).value||0;
  const o={id:id||uid(),name:n,base:+$('fb').value||100,u:$('fu').value,p:g('p'),c:g('c'),f:g('f'),m:{}};
  {const o0=id&&food(id);o.bc=pend.bc||(o0&&o0.bc)||undefined}
  o.kcal=$('fkcal').value===''?r0(4*o.p+4*o.c+9*o.f):g('kcal');
  S.micros.forEach(x=>{const el=$('m_'+x.k);o.m[x.k]=el?(+el.value||0):0});
  if(id){const old=food(id);o.m=Object.assign({},old.m,o.m);S.foods[S.foods.findIndex(x=>x.id===id)]=o}else S.foods.push(o);
  save();const pm=pend.mid;if(pm){$('modal').innerHTML='';render();amt(o.id,pm)}else closeM();
}
function delFood(id){S.foods=S.foods.filter(f=>f.id!==id);S.log=S.log.filter(e=>e.foodId!==id);S.combos.forEach(c=>c.items=c.items.filter(it=>it.foodId!==id));save();closeM()}
function delLog(id){S.log=S.log.filter(e=>e.id!==id);save();render()}

function comboSheet(id){
  if(!S.foods.length){tab='foods';render();foodSheet();return}
  cb=id?JSON.parse(JSON.stringify(S.combos.find(c=>c.id===id))):{id:'',name:'',items:[]};drawCombo();
}
function cbSync(){cb.name=$('cn').value;cb.items.forEach((it,i)=>{it.foodId=$('cf'+i).value;it.v=+$('cg'+i).value||0;it.u=$('cu'+i).value})}
function drawCombo(){
  modal(`<h2>${cb.id?'Edit saved meal':'New saved meal'}</h2><label>Name</label><input id="cn" value="${esc(cb.name)}" placeholder="Chicken, rice and broccoli"><label style="margin-top:18px">Ingredients and amounts</label>`+
  cb.items.map((it,i)=>`<div class="ing"><select id="cf${i}">${S.foods.map(f=>`<option value="${f.id}"${f.id===it.foodId?' selected':''}>${esc(f.name)}</option>`).join('')}</select><input id="cg${i}" type="number" inputmode="decimal" placeholder="Amount" value="${it.v||''}"><select id="cu${i}">${['g','ml','mg'].map(u=>`<option${u===it.u?' selected':''}>${u}</option>`).join('')}</select><button class="x" aria-label="Remove ingredient" onclick="cbDel(${i})">✕</button></div>`).join('')+
  `<button class="add" onclick="cbAdd()">+ Ingredient</button><button class="cta" onclick="saveCombo()">Save meal</button>${cb.id?`<button class="link" onclick="delCombo('${cb.id}')">Delete this meal</button>`:''}`);
}
function cbAdd(){cbSync();cb.items.push({foodId:S.foods[0].id,v:'',u:S.foods[0].u});drawCombo()}
function cbDel(i){cbSync();cb.items.splice(i,1);drawCombo()}
function saveCombo(){
  cbSync();if(!cb.name.trim()){$('cn').focus();return}
  cb.items=cb.items.filter(it=>it.v>0&&food(it.foodId));
  if(!cb.items.length){return}
  if(cb.id)S.combos[S.combos.findIndex(c=>c.id===cb.id)]=cb;else{cb.id=uid();S.combos.push(cb)}
  save();closeM();
}
function delCombo(id){S.combos=S.combos.filter(c=>c.id!==id);save();closeM()}

function logSheet(mid){
  modal(`<h2>Add to ${mname(mid)}</h2><button class="add" style="margin-bottom:10px" onclick="scanSheet('${mid}')">Scan barcode</button><input id="q" placeholder="Search foods and saved meals" oninput="fl('${mid}')"><div id="fl" style="margin-top:12px"></div>`);fl(mid);
}
function fl(mid){
  const q=($('q').value||'').toLowerCase();
  const a=S.combos.filter(c=>c.name.toLowerCase().includes(q)).map(c=>`<button class="item" onclick="cmbAmt('${c.id}','${mid}')"><div class="nm"><div>${esc(c.name)}</div><div class="sub">Saved meal · ${c.items.length} ingredients</div></div><div class="k">${r0(comboTot(c).kcal)}</div></button>`);
  const b=S.foods.filter(f=>f.name.toLowerCase().includes(q)).map(f=>`<button class="item" onclick="amt('${f.id}','${mid}')"><div class="nm"><div>${esc(f.name)}</div><div class="sub">per ${f.base} ${f.u}</div></div><div class="k">${r0(f.kcal)}</div></button>`);
  $('fl').innerHTML=a.concat(b).join('')||'<div class="empty">No match. Add it in Foods.</div>';
}
function amt(id,mid){
  const f=food(id);
  modal(`<h2>${esc(f.name)}</h2><label>Amount</label><div class="g3b"><input id="an" type="number" inputmode="decimal" value="${f.base}" oninput="pv('${id}')"><select id="au" onchange="pv('${id}')"><option>${f.u}</option><option>mg</option></select></div><div id="pv" class="sub" style="margin-top:10px"></div><button class="cta" onclick="addLog('${id}','${mid}')">Add to ${mname(mid)}</button>`);pv(id);
}
function pv(id){const f=food(id),n=mult(f,+$('an').value||0,$('au').value);$('pv').textContent=`${r0(f.kcal*n)} kcal · P ${r0(f.p*n)} C ${r0(f.c*n)} F ${r0(f.f*n)}`}
function addLog(id,mid){const f=food(id),v=+$('an').value;if(!(v>0))return;S.log.push({id:uid(),date:day,foodId:id,n:mult(f,v,$('au').value),meal:mid});save();closeM()}
function cmbAmt(cid,mid){
  const c=S.combos.find(x=>x.id===cid);
  modal(`<h2>${esc(c.name)}</h2><label>Portions</label><input id="cp" type="number" inputmode="decimal" step="0.25" value="1" oninput="cpv('${cid}')"><div id="cpv" class="sub" style="margin-top:10px"></div><button class="cta" onclick="addCombo('${cid}','${mid}')">Add to ${mname(mid)}</button>`);cpv(cid);
}
function cpv(cid){const t=comboTot(S.combos.find(x=>x.id===cid)),n=+$('cp').value||0;$('cpv').textContent=`${r0(t.kcal*n)} kcal · P ${r0(t.p*n)} C ${r0(t.c*n)} F ${r0(t.f*n)}`}
function addCombo(cid,mid){
  const c=S.combos.find(x=>x.id===cid),p=+$('cp').value;if(!(p>0))return;
  c.items.forEach(it=>{const f=food(it.foodId);if(f)S.log.push({id:uid(),date:day,foodId:it.foodId,n:mult(f,it.v,it.u)*p,meal:mid})});
  save();closeM();
}
const IC=[['🥩',/beef|steak|mince|lamb|pork|bacon|\bham\b|sausage/],['🍗',/chicken|turkey/],['🐟',/fish|salmon|tuna|snapper|prawn|shrimp/],['🥚',/\beggs?\b/],['🥛',/milk|yoghurt|yogurt|cream/],['🧀',/cheese/],['🍚',/rice|\boats?\b|quinoa|couscous|cereal/],['🍝',/pasta|noodle|spaghetti/],['🍞',/bread|wrap|toast|bagel/],['🥔',/potato|kumara/],['🥦',/broccoli|cauli|cabbage|spinach|kale|lettuce|salad|veg|beans|peas|carrot|capsicum|zucchini|onion/],['🍌',/banana/],['🍎',/apple|pear/],['🍓',/berr/],['🍊',/orange|mandarin|lemon/],['🥑',/avocado/],['🥜',/nut|almond/],['🫒',/\boil\b|olive/],['🍫',/choc|candy/],['💊',/vitamin|supplement|zinc|magnesium|collagen|capsule|whey|protein powder/]];
const icon=n=>{n=(n||'').toLowerCase();const m=IC.find(x=>x[1].test(n));return m?m[0]:'🛒'};
function vShop(){
  const L=S.shop,open=L.filter(x=>!x.d),done=L.filter(x=>x.d);
  const row=x=>`<div class="item"><button class="chk ${x.d?'on':''}" aria-label="Got it" onclick="shTg('${x.id}')">${x.d?'✓':''}</button><button class="ico" aria-label="Change icon" onclick="shIcon('${x.id}')">${x.e||icon(x.n)}</button><div class="nm"><div style="${x.d?'text-decoration:line-through;color:var(--dim)':''}">${esc(x.n)}</div>${x.q?`<div class="sub">${esc(x.q)}</div>`:''}</div><button class="x" aria-label="Remove" onclick="shDel('${x.id}')">✕</button></div>`;
  return hdr('Shopping list')+(L.length?open.map(row).join('')+(done.length?`<h2>In the trolley</h2>`+done.map(row).join('')+`<button class="cta alt" onclick="shClear()">Clear ticked items</button>`:''):'<div class="empty">Nothing on your list yet. Add items below, or pick from your foods.</div>')+
  `<div class="panel"><label style="margin-top:0">Add an item</label><div class="g3b"><input id="shn" placeholder="NZ beef mince"><input id="shq" placeholder="Qty"></div><button class="cta" onclick="shAdd()">Add to list</button><button class="cta alt" onclick="shPick()">Pick from my foods</button></div>`;
}
function shAdd(){const n=$('shn').value.trim();if(!n){$('shn').focus();return}S.shop.push({id:uid(),n,q:$('shq').value.trim(),d:false});save();render()}
function shTg(id){const x=S.shop.find(y=>y.id===id);x.d=!x.d;save();render()}
function shDel(id){S.shop=S.shop.filter(y=>y.id!==id);save();render()}
function shClear(){S.shop=S.shop.filter(y=>!y.d);save();render()}
function shIcon(id){const x=S.shop.find(y=>y.id===id),e=prompt('Type an emoji for this item (leave empty for automatic)',x.e||icon(x.n));if(e===null)return;x.e=e.trim()||undefined;save();render()}
function shOn(n){return S.shop.some(x=>!x.d&&x.n===n)}
function shPick(){
  modal(`<h2>Add to shopping list</h2>`+(S.foods.length||S.combos.length?
  S.combos.map(c=>`<button class="item" onclick="shFrom('c','${c.id}')"><span class="ico">🍽️</span><div class="nm"><div>${esc(c.name)}</div><div class="sub">Saved meal · adds its ingredients</div></div></button>`).join('')+
  S.foods.map(f=>`<button class="item" onclick="shFrom('f','${f.id}')"><span class="ico">${icon(f.name)}</span><div class="nm"><div>${esc(f.name)}</div></div><div class="k">${shOn(f.name)?'✓':''}</div></button>`).join('')+`<button class="cta" onclick="closeM()">Done</button>`:'<div class="empty">Add foods in the Foods tab first.</div>'));
}
function shFrom(t,id){
  if(t==='f'){const f=food(id);if(!shOn(f.name))S.shop.push({id:uid(),n:f.name,q:'',d:false})}
  else S.combos.find(c=>c.id===id).items.forEach(it=>{const f=food(it.foodId);if(f&&!shOn(f.name))S.shop.push({id:uid(),n:f.name,q:it.v+' '+it.u,d:false})});
  save();shPick();
}
const THEMES={
 dark:{bg:'#12141C',panel:'#1A1D29',raise:'#232736',line:'#2C3142',text:'#ECEBF4',dim:'#8C90A6',p:'#8B9BFF',c:'#F2B66D',f:'#F48FB1',over:'#FF7A7A',cs:'dark'},
 black:{bg:'#000000',panel:'#0E0F14',raise:'#1A1C25',line:'#262938',text:'#F2F2F7',dim:'#8C90A6',p:'#8B9BFF',c:'#F2B66D',f:'#F48FB1',over:'#FF7A7A',cs:'dark'},
 light:{bg:'#F3F4F8',panel:'#FFFFFF',raise:'#ECEEF4',line:'#DADDE8',text:'#171A26',dim:'#6B7086',p:'#5568E8',c:'#C77D0E',f:'#D9457A',over:'#D94040',cs:'light'}};
function applyTheme(){
  const t=THEMES[S.set.theme]||THEMES.dark,r=document.documentElement.style,a=S.set.accent||'#6FD3C0';
  ['bg','panel','raise','line','text','dim','p','c','f','over'].forEach(k=>r.setProperty('--'+k,t[k]));
  r.setProperty('--accent',a);
  const n=parseInt(a.slice(1),16),L=0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255);
  r.setProperty('--on',L>150?'#12141C':'#FFFFFF');
  r.colorScheme=t.cs;
  document.querySelector('meta[name=theme-color]').content=t.bg;
  document.querySelector('meta[name=color-scheme]').content=t.cs;
}
function settingsSheet(){
  const th=S.set.theme,ac=S.set.accent;
  modal(`<h2>Settings</h2><label style="margin-top:0">Theme</label><div class="g3b" style="grid-template-columns:1fr 1fr 1fr">${[['dark','Dark'],['black','Black'],['light','Light']].map(([k,l])=>`<button class="seg ${th===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>
  <label>Accent colour</label><div class="sw">${['#6FD3C0','#8B9BFF','#F48FB1','#F2B66D','#8FD694','#5BB5F5'].map(c=>`<button class="dot" style="background:${c}" aria-label="Accent ${c}" onclick="setAccent('${c}')"></button>`).join('')}</div>
  <label>Or pick any colour</label><input id="ac" type="color" value="${ac}" oninput="setAccent(this.value,1)" style="height:52px;padding:4px"><button class="cta" onclick="closeM()">Done</button>`);
}
function setTheme(k){S.set.theme=k;save();applyTheme();settingsSheet()}
function setAccent(c,live){S.set.accent=c;save();applyTheme();if(!live)settingsSheet()}
function stopQr(){const q=qr;qr=null;return q?q.stop().then(()=>q.clear()).catch(()=>{}):Promise.resolve()}
function scanSheet(mid){
  mid=mid||'';
  modal(`<h2>Scan barcode</h2><div id="rd" style="border-radius:16px;overflow:hidden;min-height:60px"></div><div id="sm" class="sub" style="margin-top:10px">Starting camera…</div>
  <label class="cta alt" style="text-align:center;cursor:pointer;color:var(--text);font-size:16px;font-weight:600;margin-bottom:0">Take a photo of the barcode<input id="bf" type="file" accept="image/*" capture="environment" style="display:none"></label>
  <label>Or type the number</label><div class="g3b"><input id="bn" inputmode="numeric" placeholder="Barcode number"><button class="add" onclick="gotCode($('bn').value,'${mid}')">Look up</button></div><div id="rd2" style="display:none"></div>`);
  $('bf').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    $('sm').textContent='Reading photo…';await stopQr();
    try{const t=await new Html5Qrcode('rd2').scanFile(file,false);gotCode(t,mid)}
    catch(err){$('sm').textContent='Could not read a barcode from that photo. Try closer, flat and well lit, or type the number.'}
  };
  if(!window.Html5Qrcode){$('sm').textContent='The scanner did not load. Check your connection and reopen the app, or type the number.';return}
  const T=Html5QrcodeSupportedFormats,cbk=c=>gotCode(c,mid),box=(w,h)=>({width:Math.floor(w*0.85),height:Math.floor(Math.min(h,w)*0.45)});
  qr=new Html5Qrcode('rd',{formatsToSupport:[T.EAN_13,T.EAN_8,T.UPC_A,T.UPC_E],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  const ok=()=>{$('sm').textContent='Hold the barcode inside the box, steady and well lit.'};
  const fail=err=>{$('sm').textContent='Camera could not start ('+((err&&err.message)||err)+'). Use the photo button or type the number.'};
  qr.start({facingMode:'environment'},{fps:15,qrbox:box,videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}},cbk,()=>{})
    .then(ok).catch(()=>{if(!qr)return;return qr.start({facingMode:'environment'},{fps:10,qrbox:box},cbk,()=>{}).then(ok)}).catch(fail);
}
let busy=false;
async function gotCode(code,mid){
  code=(code||'').replace(/\D/g,'');if(code.length<6||busy)return;busy=true;
  await stopQr();
  const have=S.foods.find(f=>f.bc===code);
  if(have){busy=false;mid?amt(have.id,mid):foodSheet(have.id);return}
  modal(`<h2>Looking up…</h2><div class="sub">Barcode ${code}</div>`);
  let d={bc:code,note:'Not found in the database. Enter the label values once and the barcode is remembered.'};
  try{
    const j=await (await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,nutriments`)).json();
    if(j.status===1&&j.product){
      const p=j.product,n=p.nutriments||{},num=k=>+n[k+'_100g']||0,r1=v=>Math.round(v*10)/10;
      d.name=[(p.brands||'').split(',')[0].trim(),p.product_name].filter(Boolean).join(' ');
      d.base=100;d.u='g';
      d.kcal=r0(n['energy-kcal_100g']!=null?num('energy-kcal'):num('energy')/4.184);
      d.p=r1(num('proteins'));d.c=r1(num('carbohydrates'));d.f=r1(num('fat'));
      const U={g:1,mg:1e3,'µg':1e6,mcg:1e6,ug:1e6};d.m={};
      S.micros.forEach(x=>{const g=num(x.n.toLowerCase().trim().replace(/\s+/g,'-').replace('fibre','fiber'));d.m[x.k]=g?+(g*(U[x.u]||1e3)).toPrecision(3):0});
      d.note='Check these against the pack label, then save. Values are per 100 g.';
    }
  }catch(e){d.note='Could not reach the database. Enter the label values; the barcode is remembered.'}
  busy=false;foodSheet(null,d,mid);
}
applyTheme();render();
</script>
